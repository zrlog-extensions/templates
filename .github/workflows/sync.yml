name: Refresh theme catalog
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: ./mvnw -B verify
      - run: bin/theme catalog-sync
      - run: bin/theme catalog-check
      - run: bin/theme market-export --output marketplace.json --legacy-output template.json
      - uses: actions/upload-artifact@v4
        with:
          name: refreshed-theme-catalog
          path: |
            catalog.json
            marketplace.json
            template.json
