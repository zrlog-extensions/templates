name: Shared theme build and publication
on:
  workflow_call:
    inputs:
      toolkit-ref:
        description: Full templates commit SHA, matching the reusable workflow revision
        required: true
        type: string
      publish:
        default: false
        type: boolean
    secrets:
      THEME_S3_BUCKET:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      AWS_ENDPOINT_URL:
        required: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Require a pinned toolkit revision
        env:
          TOOLKIT_REF: ${{ inputs.toolkit-ref }}
        run: '[[ "$TOOLKIT_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          path: theme
      - uses: actions/checkout@v4
        with:
          repository: zrlog-extensions/templates
          ref: ${{ inputs.toolkit-ref }}
          path: templates
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: templates/pom.xml
      - run: ./mvnw -B verify
        working-directory: templates
      - name: Build from caller's theme descriptor
        run: templates/bin/theme build theme --output-dir dist
      - name: Verify installed package on the real runtime
        run: |
          source_dir=$(jq -r .sourceDirectory theme/theme.json)
          theme_id=$(jq -r .id theme/theme.json)
          bash templates/bin/verify-preview.sh "theme/$source_dir" 17081 "$theme_id"
      - uses: actions/upload-artifact@v4
        with:
          name: theme-package
          path: dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-evidence
          path: templates/target/preview-check/
  publish:
    if: inputs.publish && startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: theme
      - uses: actions/checkout@v4
        with:
          repository: zrlog-extensions/templates
          ref: ${{ inputs.toolkit-ref }}
          path: templates
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: templates/pom.xml
      - run: ./mvnw -B -DskipTests package
        working-directory: templates
      - run: templates/bin/theme publish theme --tag "$GITHUB_REF_NAME" --output-dir dist
        env:
          GH_TOKEN: ${{ github.token }}
          ZRLOG_THEME_S3_BUCKET: ${{ secrets.THEME_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_DEFAULT_REGION: auto
