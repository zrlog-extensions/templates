name: Shared theme descriptor validation
on:
  workflow_call:
    inputs:
      toolkit-ref:
        description: Full templates commit SHA, matching this workflow revision
        required: true
        type: string
permissions:
  contents: read
jobs:
  descriptor:
    runs-on: ubuntu-latest
    steps:
      - name: Require a pinned toolkit revision
        env:
          TOOLKIT_REF: ${{ inputs.toolkit-ref }}
        run: '[[ "$TOOLKIT_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          path: theme
      - uses: actions/checkout@v4
        with:
          repository: zrlog-extensions/templates
          ref: ${{ inputs.toolkit-ref }}
          path: templates
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: templates/pom.xml
      - run: ./mvnw -B verify
        working-directory: templates
      - run: templates/bin/theme descriptor-check theme/theme.json
